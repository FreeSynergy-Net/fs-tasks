# cargo-nextest profiles for fs-tasks (workflow testlauf, CLAUDE.md §4: little but often). Naming convention as fs-forms/fs-components.
# Geprüft mit `cargo nextest list` (C4 Batch 3). Zuordnung nach Binary-Namen.
# Stufen: quick (Unit/Modell, ohne picture) | picture (gezeichnete Bilder, GPU/Software-Vulkan, nie in quick) | release (nur CI, alles).
# Weitere Stufen (time/socket/security/platform) bewusst nicht definiert: kein belegter eindeutiger Treffer; Handprüfung siehe BERICHT-nextest-b3.md.

[profile.default]
fail-fast = false

[profile.quick]
default-filter = "not binary_id(/picture|theme/)"
fail-fast = true
retries = 0
slow-timeout = { period = "30s", terminate-after = 4 }

[profile.picture]
default-filter = "binary_id(/picture|theme/)"
fail-fast = false
retries = 0
slow-timeout = { period = "60s", terminate-after = 5 }

[profile.release]
fail-fast = false
retries = 0
slow-timeout = { period = "60s", terminate-after = 10 }
