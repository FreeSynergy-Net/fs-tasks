# Release of the data package fs-tasks on a version tag (fs-release caller, pinned): ONE noarch RPM `fs-tasks` (kind data, built from scaffold.toml).
# No binary, no Cargo package: the program is data (forms/, styles/) plus the modules named in scaffold.toml.
name: release
on:
  push: { tags: ["v*"] }
permissions:
  contents: write
  id-token: write
  attestations: write
  packages: write
jobs:
  release:
    uses: FreeSynergy-Net/fs-release/.github/workflows/release.yml@e6b9ed0622222ed973987a01c4bd4170bc53be3f
    with:
      kind: data
      name: fs-tasks
      binaries: ""
      macos: false
      windows-targets: ""
    secrets:
      GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
      GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
