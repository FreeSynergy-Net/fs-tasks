[package]
name = "fs-tasks-app"
description = "The tasks program of FreeSynergy, first window: list and status view of one set of tasks; search, create, edit, delete, move; iCalendar in and out; on fs-components"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[features]
# The window writes what is typed into its fields to `FS_TEST_ACCESS_FILE` (fs-components `test-access`). ONLY for the
# typing test, in a debug build: fs-components refuses the feature in a release build (compile_error), and no release
# manifest of ours turns it on.
test-access = ["fs-components-app/test-access"]

[dependencies]
fs-tasks-core = { path = "../fs-tasks-core", version = "0.0.10" }
fs-tasks-server = { path = "../fs-tasks-server", version = "0.0.10" }
fs-interfaces = { git = "https://github.com/FreeSynergy-Net/fs-interfaces", rev = "6b02b138b3e55c290d6cbd957976013cc49dca5d", version = "0.3.0" }
fs-rpc = { git = "https://github.com/FreeSynergy-Net/fs-rpc", rev = "e3871c3b2438fae23fdc1eb6c72dd7c125f21abd", version = "0.1.4" }
fs-objects = { git = "https://github.com/FreeSynergy-Net/fs-objects", rev = "e38093f1ec61b7c9faaa6f6046f65addb11dcf46", version = "0.0.11" }
fs-components-app = { git = "https://github.com/FreeSynergy-Net/fs-components", rev = "81367489094efee62ec16194be67df4a588045a0", version = "0.1.0" }
fs-components-widgets = { git = "https://github.com/FreeSynergy-Net/fs-components", rev = "81367489094efee62ec16194be67df4a588045a0", version = "0.1.0" }
fs-components-workbenches = { git = "https://github.com/FreeSynergy-Net/fs-components", rev = "81367489094efee62ec16194be67df4a588045a0", version = "0.1.0" }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread"] }

[dev-dependencies]
fs-objects = { git = "https://github.com/FreeSynergy-Net/fs-objects", rev = "e38093f1ec61b7c9faaa6f6046f65addb11dcf46", version = "0.0.11", features = ["testing"] }
tempfile = "3"
async-trait = "0.1"
fs-components-render = { git = "https://github.com/FreeSynergy-Net/fs-components", rev = "81367489094efee62ec16194be67df4a588045a0", version = "0.1.0" }
