[package]
name = "fs-tasks-cli"
description = "Command line of FreeSynergy tasks: a second user of tasks.capnp, next to the MCP tools"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
name = "fs_tasks_cli"

[dependencies]
fs-interfaces = { git = "https://github.com/FreeSynergy-Net/fs-interfaces", rev = "83b96e30ae3f8a04a222fa5a34dc4ad29306cdf2", version = "0.2.0" }
fs-rpc = { git = "https://github.com/FreeSynergy-Net/fs-rpc", rev = "9585ed181fc98db7e504272f451a10245dca7f1a", version = "0.1.4" }
fs-objects = { git = "https://github.com/FreeSynergy-Net/fs-objects", rev = "e38093f1ec61b7c9faaa6f6046f65addb11dcf46", version = "0.0.11" }
fs-tasks-core = { path = "../fs-tasks-core", version = "0.0.10", features = ["contract"] }
fs-tasks-server = { path = "../fs-tasks-server", version = "0.0.10" }
capnp = "0.27"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "macros", "time"] }

[dev-dependencies]
fs-objects = { git = "https://github.com/FreeSynergy-Net/fs-objects", rev = "e38093f1ec61b7c9faaa6f6046f65addb11dcf46", version = "0.0.11", features = ["testing"] }
tempfile = "3"
tokio = { version = "1", features = ["full"] }
