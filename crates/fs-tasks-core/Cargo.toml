[package]
name = "fs-tasks-core"
description = "Program core of FreeSynergy tasks: JSCalendar 2.0 Task over fs-objects behind the TaskItems interface, RFC 9253 relations, iCalendar VTODO"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
# Cap'n Proto contract: the schema and generated code live in fs-interfaces (ADR 0045).
contract = ["dep:capnp"]

[dependencies]
fs-objects = { git = "https://github.com/FreeSynergy-Net/fs-objects", rev = "e38093f1ec61b7c9faaa6f6046f65addb11dcf46", version = "0.0.11" }
# Shared JSCalendar types (time, rule, participants, upgrade, validation, iCalendar); Task itself is ours (ADR 0050).
fs-jscalendar = { git = "https://github.com/FreeSynergy-Net/fs-jscalendar", rev = "0a3add97339c92be0ab8b524a294ca44ee8dca25", version = "0.0.7" }
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
async-trait = "0.1"
tokio = { version = "1", features = ["sync"] }
capnp = { version = "0.27", optional = true }
# The contract and the provider rule (ADR 0045). The generated code is re-exported with feature `contract`.
fs-interfaces = { git = "https://github.com/FreeSynergy-Net/fs-interfaces", rev = "4fcd013e60f8859ad70b203f2838d4b23912c1f4", version = "0.3.0" }

[dev-dependencies]
fs-objects = { git = "https://github.com/FreeSynergy-Net/fs-objects", rev = "e38093f1ec61b7c9faaa6f6046f65addb11dcf46", version = "0.0.11", features = ["testing"] }
tokio = { version = "1", features = ["full"] }
tempfile = "3"
