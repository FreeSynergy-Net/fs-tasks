[package]
name = "fs-tasks-testdata"
description = "Test providers, conformance rules and fixed sample data of FreeSynergy tasks: a fake of the locked Tasks trait (tasks_v1)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
async-trait = "0.1"
chrono = { version = "0.4", default-features = false, features = ["std"] }
chrono-tz = "0.10"
# Same pins as the locked trait folder (tasks_v1): fs-types 722d3ce0, fs-jscalendar 0a3add97.
fs-types = { git = "https://github.com/FreeSynergy-Net/fs-types", rev = "722d3ce0156711d40cb278f2e835e865d9448290", version = "0.0.7" }
fs-jscalendar = { git = "https://github.com/FreeSynergy-Net/fs-jscalendar", rev = "0a3add97339c92be0ab8b524a294ca44ee8dca25", version = "0.0.7" }
# FakePeople = the FakeDirectory of the locked person_directory_v1: fs-people main b3e6381b (no tag yet; lift to a tag when one exists).
fs-people-directory = { git = "https://github.com/FreeSynergy-Net/fs-people", rev = "b3e6381b5f7a77ae1cf892bcccced85e5b47e7c7", version = "0.0.14" }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
