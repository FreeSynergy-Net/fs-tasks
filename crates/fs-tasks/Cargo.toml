[package]
name = "fs-tasks"
description = "FreeSynergy.Tasks: one program, one command (ADR 0063): the window, `serve`, and the command line"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "fs-tasks"
path = "src/main.rs"

[features]
default = ["gui"]
# The window. Servers and machines without a screen build with --no-default-features.
gui = ["dep:fs-tasks-app"]
# The text of the fields can be read by the typing test (debug builds only, see fs-tasks-app).
test-access = ["gui", "fs-tasks-app/test-access"]
# A FIXED owner instead of the person "me" of the module person: for the tests that run the program as a process. Never shipped.
fake-owner = ["fs-interfaces/fake"]

[dependencies]
fs-tasks-server = { path = "../fs-tasks-server", version = "0.0.10" }
fs-tasks-cli = { path = "../fs-tasks-cli", version = "0.0.10" }
fs-interfaces = { git = "https://github.com/FreeSynergy-Net/fs-interfaces", rev = "83b96e30ae3f8a04a222fa5a34dc4ad29306cdf2", version = "0.2.0" }
fs-objects = { git = "https://github.com/FreeSynergy-Net/fs-objects", rev = "e38093f1ec61b7c9faaa6f6046f65addb11dcf46", version = "0.0.11" }
# The owner is the person "me" of the module person, asked from its service and never made up.
fs-person-service = { git = "https://github.com/FreeSynergy-Net/fs-modules-person", rev = "36604aa5b9de34f3788be56607f9b5983079ce59", version = "0.0.1", features = ["client"] }
fs-tasks-app = { path = "../fs-tasks-app", version = "0.0.10", optional = true }

[dev-dependencies]
fs-rpc = { git = "https://github.com/FreeSynergy-Net/fs-rpc", rev = "9585ed181fc98db7e504272f451a10245dca7f1a", version = "0.1.4" }
tokio = { version = "1", features = ["full"] }
tempfile = "3"

[[test]]
name = "dispatch"
required-features = ["fake-owner"]

[[test]]
name = "window"
required-features = ["fake-owner"]

[[test]]
name = "hang"
required-features = ["fake-owner"]

[[test]]
name = "worker"
required-features = ["fake-owner"]

[[test]]
name = "binary"
required-features = ["fake-owner"]

[[test]]
name = "datadir"
required-features = ["fake-owner"]
