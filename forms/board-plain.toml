# forms description of the fs-tasks frontend "board-plain" (plain board: cards show title and due date only).
# BINDING (round 2, workflow frontend-beschreiben, step layout-schreiben): source = module planning, pattern forms/board.toml.
# No colour and no size in this file (style `plain` lives in the style layer). No fake source.
# Form: cards-in-columns@1.3.0 (fs-interfaces main 7bbad2ff schema/forms.txt). Used channels: cards, column, title, facts (due only),
# order (read), move (after/before written by the module), create, remove. NOT used on purpose: lane, progress, priority,
# participants, keywords, and since 1.3.0 description, color, estimated, column-limit. The module holds more; this frontend does not show it.
# Channels column-label, after, before are bound by the MODULE (catalog/forms.json), not here (forms/README.md).
# The description only chooses the trigger and the command key: drop -> card.move, quick-add -> task.create, menu -> task.delete.
schema = 1
kind = "frontend"
id = "board-plain"
extends = "net.freesynergy.Tasks"
exec = "fs-forms-run"
title = "tasks-board-plain-title"
style = "plain"
message = [
  { key = "tasks-board-plain-title", lang = "en", text = "Tasks" },
  { key = "tasks-board-plain-title", lang = "de", text = "Aufgaben" },
  { key = "tasks-board-plain-empty-title", lang = "en", text = "No tasks here yet" },
  { key = "tasks-board-plain-empty-title", lang = "de", text = "Hier ist noch keine Aufgabe" },
  { key = "tasks-board-plain-empty-text", lang = "en", text = "What needs to be done?" },
  { key = "tasks-board-plain-empty-text", lang = "de", text = "Was ist zu tun?" },
]

[[requires]]
contract = "planning@>=0.0.1, <0.1.0"

# Source 1 = the tasks provider (module planning, as in board.toml).
[[source]]
n = 1
contract = "planning@>=0.0.1, <0.1.0"
type = "Task"
scope = "selected-list"

# ---- page "board": the board in the main area, nothing beside it
[[page]]
page = "board"
frame = "workbench"

[[page.block]]
place = "main"
block = "board"
source = 1
bind = [
  { slot = "cards", nth = 0 },
  { slot = "columns", nth = 0, grouping = "board" },
  { slot = "order", nth = 0, order = "rank" },
  { slot = "card-title", nth = 0, field = "title", role = "display" },
  { slot = "card-facts", nth = 0, field = "due", role = "compact" },
  { slot = "move", nth = 0, command = "card.move" },
  { slot = "quick-add", nth = 0, command = "task.create" },
  { slot = "card-menu", nth = 0, command = "task.delete" },
]

# actions: drag a card (move), entry row (create), delete (confirm: data is lost)
[[action]]
trigger = "quick-add"
source = 1
command = "task.create"

[[action]]
trigger = "drop"
source = 1
command = "card.move"

[[action]]
trigger = "menu"
source = 1
command = "task.delete"
confirm = "confirm"

# states the host shows without code
[[page.block]]
place = "empty"
block = "empty-state"
title = "tasks-board-plain-empty-title"
text = "tasks-board-plain-empty-text"
