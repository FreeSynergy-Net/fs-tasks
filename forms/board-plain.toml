# forms description of the fs-tasks frontend "board-plain" (plain board: cards show title and due date only).
# BINDING (round 2, workflow frontend-beschreiben, step layout-schreiben): source = module planning, pattern forms/board.toml.
# No colour and no size in this file (style `plain` lives in the style layer). No fake source.
# Form: cards-in-columns@1.3.0 (fs-interfaces main 7bbad2ff schema/forms.txt). Used channels: cards, column, title, facts (due only),
# order (read), move (after/before written by the module), create, remove. NOT used on purpose: lane, progress, priority,
# participants, keywords, and since 1.3.0 description, color, estimated, column-limit. The module holds more; this frontend does not show it.
# Channels column-label, after, before are bound by the MODULE (catalog/forms.json), not here (forms/README.md).
# The description only chooses the trigger and the command key: drop -> card.move, quick-add -> task.create, menu -> task.delete.
schema = 3
kind = "frontend"
id = "board-plain"
extends = "net.freesynergy.Tasks"
exec = "fs-forms-run"
title = "tasks-board-plain-title"
style = "plain"

[[requires]]
elem = "requires:1"
contract = "planning@>=0.0.1, <0.1.0"

# Source 1 = the tasks provider (module planning, as in board.toml).
[[source]]
elem = "source:1"
n = 1
contract = "planning@>=0.0.1, <0.1.0"
type = "Task"
scope = "selected-list"

# ---- page "board": the board in the main area, nothing beside it
[[page]]
elem = "page:board"
page = "board"
frame = "workbench"

[[page.place]]
elem = "block:board/main"
at = "main"
block = "board"
source = 1

[[page.place.bind]]
elem = "binding:board/main/card-facts/0"
slot = "card-facts"
nth = 0
field = "due"
role = "compact"

[[page.place.bind]]
elem = "binding:board/main/card-menu/0"
slot = "card-menu"
nth = 0
command = "task.delete"

[[page.place.bind]]
elem = "binding:board/main/card-title/0"
slot = "card-title"
nth = 0
field = "title"
role = "display"

[[page.place.bind]]
elem = "binding:board/main/cards/0"
slot = "cards"
nth = 0

[[page.place.bind]]
elem = "binding:board/main/columns/0"
slot = "columns"
nth = 0
grouping = "board"

[[page.place.bind]]
elem = "binding:board/main/move/0"
slot = "move"
nth = 0
command = "card.move"

[[page.place.bind]]
elem = "binding:board/main/order/0"
slot = "order"
nth = 0
order = "rank"

[[page.place.bind]]
elem = "binding:board/main/quick-add/0"
slot = "quick-add"
nth = 0
command = "task.create"

# states the host shows without code
[[page.place]]
elem = "block:board/empty"
at = "empty"
block = "empty-state"
title = "tasks-board-plain-empty-title"
text = "tasks-board-plain-empty-text"

# actions: drag a card (move), entry row (create), delete (confirm: data is lost)
[[action]]
elem = "action:1"
trigger = "quick-add"
source = 1
command = "task.create"

[[action]]
elem = "action:2"
trigger = "drop"
source = 1
command = "card.move"

[[action]]
elem = "action:3"
trigger = "menu"
source = 1
command = "task.delete"
confirm = "confirm"

[[message]]
elem = "message:tasks-board-plain-empty-text/de"
key = "tasks-board-plain-empty-text"
lang = "de"
text = "Was ist zu tun?"

[[message]]
elem = "message:tasks-board-plain-empty-text/en"
key = "tasks-board-plain-empty-text"
lang = "en"
text = "What needs to be done?"

[[message]]
elem = "message:tasks-board-plain-empty-title/de"
key = "tasks-board-plain-empty-title"
lang = "de"
text = "Hier ist noch keine Aufgabe"

[[message]]
elem = "message:tasks-board-plain-empty-title/en"
key = "tasks-board-plain-empty-title"
lang = "en"
text = "No tasks here yet"

[[message]]
elem = "message:tasks-board-plain-title/de"
key = "tasks-board-plain-title"
lang = "de"
text = "Aufgaben"

[[message]]
elem = "message:tasks-board-plain-title/en"
key = "tasks-board-plain-title"
lang = "en"
text = "Tasks"
