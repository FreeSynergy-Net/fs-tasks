# Pattern: Composite – a tree of blocks (page, frame, block, place) as plain data; deviation: no trait, only data (the host reads it).
# forms description of the fs-tasks frontend "board-swimlanes" (workflow frontend-beschreiben, step layout-schreiben, Runde 2: BINDEN).
# Form: cards-in-columns@1.3.0 (fs-interfaces main 7bbad2ff schema/forms.txt). Source: module planning (contract planning@>=0.0.1, <0.1.0).
# Pattern of the bindings: forms/board.toml (slot = block input, field = provider field, command = contract key, no module prefix).
# Nach Gestalt benannt: Bahnen (Swimlanes) mit Klappkopf und Zähler, Spalten mit Zahl, Karten mit Faktenzeile.
# Bewusst andere Daten als `board` (Status-Spalten) und `board-wip` (Schwester-Frontend): Bahnen sind eine Gruppierung je Karte.
#
# Bindings in this file: [[source]], bind arrays on the page blocks, and the three command actions (trigger and key only).
# The channels of the form are bound here where a slot exists. Channels WITHOUT a slot are NOT faked; each is marked "offen" below.
# Channel `after`/`before` of `move` is written by the MODULE (catalog/forms.json, key `map`), never by this file.
#
# Channel -> binding (form cards-in-columns@1.3.0):
#   cards         -> slot `cards` (block board, records)                      BOUND
#   column        -> slot `columns` grouping `board`                           BOUND (the column id is the grouping, not a field)
#   title         -> slot `card-title` field `title`                           BOUND
#   facts (0..4)  -> slot `card-facts` nth 0: due (the only fact this frontend takes)                  BOUND
#   priority      -> slot `card-facts` nth 1 (own channel since 1.3.0, shown as a number until Bündel 1b)  BOUND
#   estimated     -> slot `card-facts` nth 2 (own channel since 1.3.0, ISO 8601 text)                    BOUND
#                    participants and keywords are NOT bound here (this frontend does not show them; card-facts holds 4 at most)
#   lane          -> slot `lanes` grouping `lane`                              BOUND, BUT NOT SERVED YET: the module maps `lane`
#                    to board membership (ABGLEICH-frontends-tasks-attribute.md, point 7); the grouping by a named lane channel is
#                    not in the host or module yet. Until then the lanes stay visibly empty (offen), never a fake lane.
#   order         -> slot `order` order `rank` (read only, the sequence as shown)  BOUND
#   move          -> slot `move` command `card.move`; writes column, after, before, lane (after/before by the module)  BOUND
#   create        -> slot `quick-add` command `task.create`; needs title, column, lane  BOUND
#   remove        -> slot `card-menu` command `task.delete`, confirm            BOUND
#   column-label  -> NO slot (block board has no label slot for the column name; board-column has part `name` only)   offen
#   progress      -> NO slot on block board/board-card (card-facts takes facts only; progress is a bar, not a fact)     offen
#
# NOT bound here, and why (offen, not faked): colour of a card (`color`, 1.3.0 channel; board-card has no colour slot),
# description (1.3.0 channel; no slot on the card, card-facts is full), column limit (`column-limit`, 1.3.0 channel; no slot on
# block board), priority as P0-P3 label (the module gives the number; the label mapping is not in the contract),
# search field and status filter (bar of the board has no slot). Details: ../FEHLENDE-COMPONENTS.md and the report
# .scratch/woche-11-23/form/BERICHT-fe-tasks-bind-board-swimlanes.md.
#
# Theme: style = "office" (the layer of ADR 0074, tokens in styles/office.tokens.json). No colour, size or font in this file.
schema = 1
kind = "frontend"
id = "board-swimlanes"
extends = "net.freesynergy.Tasks"
exec = "fs-forms-run"
title = "board-swimlanes-title"
style = "office"
message = [
  { key = "board-swimlanes-title", lang = "en", text = "Tasks by lane" },
  { key = "board-swimlanes-title", lang = "de", text = "Aufgaben nach Bahnen" },
  { key = "board-swimlanes-side-title", lang = "en", text = "Projects and labels" },
  { key = "board-swimlanes-side-title", lang = "de", text = "Projekte und Labels" },
  { key = "board-swimlanes-empty-title", lang = "en", text = "No tasks in these lanes" },
  { key = "board-swimlanes-empty-title", lang = "de", text = "Keine Aufgaben in diesen Bahnen" },
  { key = "board-swimlanes-empty-text", lang = "en", text = "Create a task to start a lane." },
  { key = "board-swimlanes-empty-text", lang = "de", text = "Lege eine Aufgabe an, dann entsteht eine Bahn." },
]

[[requires]]
contract = "planning@>=0.0.1, <0.1.0"

# Source 1 = the planning module (fs-modules-planning), the type Task (JSCalendar Task, RFC 8984).
[[source]]
n = 1
contract = "planning@>=0.0.1, <0.1.0"
type = "Task"
scope = "selected-list"

# ---- page "board-swimlanes": a workbench with the side list and the main area.
[[page]]
page = "board-swimlanes"
frame = "workbench"
navigation = "list-detail"

# Side list (projects, labels). Not bound: sidebar slots are not declared in the catalog (offen).
[[page.block]]
place = "side"
block = "sidebar"
source = 1
title = "board-swimlanes-side-title"

# Main area: ONE board. Lanes are the first level (slot `lanes`), columns inside each lane (slot `columns`).
[[page.block]]
place = "main"
block = "board"
source = 1
bind = [
  { slot = "cards", nth = 0 },
  { slot = "lanes", nth = 0, grouping = "lane" },
  { slot = "columns", nth = 0, grouping = "board" },
  { slot = "order", nth = 0, order = "rank" },
  { slot = "card-title", nth = 0, field = "title", role = "display" },
  { slot = "card-facts", nth = 0, field = "due", role = "compact" },
  { slot = "card-facts", nth = 1, field = "priority", role = "compact" },
  { slot = "card-facts", nth = 2, field = "estimated", role = "compact" },
  { slot = "move", nth = 0, command = "card.move" },
  { slot = "quick-add", nth = 0, command = "task.create" },
  { slot = "card-menu", nth = 0, command = "task.delete" },
]

# Empty state (texts are keys of this file).
[[page.block]]
place = "empty"
block = "empty-state"
title = "board-swimlanes-empty-title"
text = "board-swimlanes-empty-text"

# Partial state (a locked or missing binding is shown as a notice, never as an empty area).
[[page.block]]
place = "partial"
block = "partial-notice"

# ---- actions: drop a card (move), entry row (create), delete (confirm: data is lost)
[[action]]
trigger = "quick-add"
source = 1
command = "task.create"

[[action]]
trigger = "drop"
source = 1
command = "card.move"

[[action]]
trigger = "menu"
source = 1
command = "task.delete"
confirm = "confirm"
