# forms description of the fs-tasks frontend "board-wip" (second board frontend, WIP-oriented).
# Round 2 (BINDING, Workflow frontend-beschreiben, order 24.11.): source 1 = planning (as forms/board.toml), binding
# of the channels of cards-in-columns@1.2.0 that this layout shows; commands card.move, task.create, task.delete.
# Channels NOT bound (no slot in the board block, or the layout does not show them): lane, progress, column-label
# (the module map delivers them; no description key), description (not a fact, 1.3.0 of C1), WIP limit per column
# (no channel), card colour, priority colour mapping (no field-choice). See FRONTENDS-tasks-attribute-board-wip.md.
# Views and menus stay host functions (no [[view]], no view switch). Theme: `style = "board-wip"` (tokens in styles/).
# Shape (named after the form, not after any model program): columns with count and limit, cards with due chip,
# priority tag, description mark; view tabs List | Gantt | Table | Kanban; filter button.
schema = 1
kind = "frontend"
id = "board-wip"
extends = "net.freesynergy.Tasks"
exec = "fs-forms-run"
title = "board-wip-title"
style = "board-wip"
message = [
  { key = "board-wip-title", lang = "en", text = "Tasks (work in progress)" },
  { key = "board-wip-title", lang = "de", text = "Aufgaben (in Arbeit)" },
  { key = "view-list", lang = "en", text = "List" },
  { key = "view-list", lang = "de", text = "Liste" },
  { key = "view-gantt", lang = "en", text = "Gantt" },
  { key = "view-gantt", lang = "de", text = "Gantt" },
  { key = "view-table", lang = "en", text = "Table" },
  { key = "view-table", lang = "de", text = "Tabelle" },
  { key = "view-kanban", lang = "en", text = "Kanban" },
  { key = "view-kanban", lang = "de", text = "Kanban" },
  { key = "filter-button", lang = "en", text = "Filters" },
  { key = "filter-button", lang = "de", text = "Filter" },
  { key = "tasks-side-title", lang = "en", text = "Projects and labels" },
  { key = "tasks-side-title", lang = "de", text = "Projekte und Labels" },
  { key = "tasks-board-empty-title", lang = "en", text = "No tasks here yet" },
  { key = "tasks-board-empty-title", lang = "de", text = "Hier ist noch keine Aufgabe" },
  { key = "tasks-board-empty-text", lang = "en", text = "What needs to be done?" },
  { key = "tasks-board-empty-text", lang = "de", text = "Was ist zu tun?" },
]

[[requires]]
contract = "planning@>=0.0.1, <0.1.0"

# Source 1 = the tasks provider; "selected-list" = the list chosen in the sidebar (as in board.toml).
[[source]]
n = 1
contract = "planning@>=0.0.1, <0.1.0"
type = "Task"
scope = "selected-list"

# ---- menu tree: standard entries only (no command, no view switch here)
[[menu]]
kind = "standard-program"

[[menu]]
kind = "standard-help"

# ---- actions: drop = card.move, quick-add = task.create, menu = task.delete (confirm: data is lost)
[[action]]
trigger = "quick-add"
source = 1
command = "task.create"

[[action]]
trigger = "drop"
source = 1
command = "card.move"

[[action]]
trigger = "menu"
source = 1
command = "task.delete"
confirm = "confirm"

# ---- page "board-wip": window shell, side strip, view tabs, board, states
[[page]]
page = "board-wip"
frame = "app-window"
navigation = "list-detail"

[[page.block]]
place = "side"
block = "sidebar"
title = "tasks-side-title"

# view tabs (List, Gantt, Table, Kanban) and the filter button sit above the board
[[page.block]]
place = "bar"
block = "tablist"

# columns with head (name, count, limit), cards below; the card parts are the board block's own.
# Binding as in board.toml; facts = the four module facts (due chip, priority tag, participants, keywords).
[[page.block]]
place = "main"
block = "board"
source = 1
bind = [
  { slot = "cards", nth = 0 },
  { slot = "columns", nth = 0, grouping = "board" },
  { slot = "order", nth = 0, order = "rank" },
  { slot = "card-title", nth = 0, field = "title", role = "display" },
  { slot = "card-facts", nth = 0, field = "due", role = "compact" },
  { slot = "card-facts", nth = 1, field = "priority", role = "compact" },
  { slot = "card-facts", nth = 2, field = "participants", role = "compact" },
  { slot = "card-facts", nth = 3, field = "keywords", role = "compact" },
  { slot = "card-lock", nth = 0, lock = true },
  { slot = "move", nth = 0, command = "card.move" },
  { slot = "quick-add", nth = 0, command = "task.create" },
  { slot = "card-menu", nth = 0, command = "task.delete" },
]

# states the host shows without code
[[page.block]]
place = "partial"
block = "partial-notice"

[[page.block]]
place = "empty"
block = "empty-state"
title = "tasks-board-empty-title"
text = "tasks-board-empty-text"
