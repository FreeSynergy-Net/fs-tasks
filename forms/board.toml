# forms description of the fs-tasks frontend "board" (the start frontend). IMPORT FORM ONLY (ADR 0096 point 6): the description
# lives as data in forms.db; this file is imported (Format 3, ids written into the file; export writes Format 3) and is never read at run time.
# Names (blocks, slots, commands, fields) are NAMES: no code, no expression. Component ids = contract/blocks/*.toml of
# fs-components main 8ede4856 (block contract 0.4). Field names = provider names; the tasks TypeCatalog does not exist yet
# (field names marked "unproven" in README.md). What the catalog cannot take yet: ../FEHLENDE-COMPONENTS.md.
# Commands are the contract keys of tasks.capnp (card.move, task.create, task.delete), without module prefix; the host binds the prefix (`planning.card.move`). The channel of the form `cards-in-columns@1.4.0` (move writes column, after, before; create; remove) is bound by the module (`catalog/forms.json`), never here; the description only chooses a trigger and a key (forms/README.md).
schema = 3
kind = "frontend"
id = "board"
extends = "net.freesynergy.Tasks"
exec = "fs-forms-run"
title = "tasks-board-title"
style = "default"

[[requires]]
elem = "requires:1"
contract = "planning@>=0.0.1, <0.1.0"

# Source 1 = the tasks provider; "selected-list" = the list chosen in the sidebar (F-010).
[[source]]
elem = "source:1"
n = 1
contract = "planning@>=0.0.1, <0.1.0"
type = "Task"
scope = "selected-list"

# ---- menu tree (M-001, M-002/M-003 as views, M-004..M-006 see PLATZHALTER.md: the frontend switch is a host function)
[[menu]]
elem = "menu:0"
kind = "standard-program"

[[menu]]
elem = "menu:1"
kind = "menu"
label = "menu-task"

[[menu.entries]]
elem = "menu:1.0"
kind = "command"
source = 1
command = "task.create"
key = "ctrl+n"

[[menu.entries]]
elem = "menu:1.1"
kind = "command"
source = 1
command = "task.delete"
on = "selected"
key = "delete"

[[menu]]
elem = "menu:2"
kind = "menu"
label = "menu-view"

[[menu.entries]]
elem = "menu:2.0"
kind = "view"
label = "view-lanes"
view = "lanes"

[[menu.entries]]
elem = "menu:2.1"
kind = "view"
label = "view-order-rank"
view = "order-rank"

[[menu.entries]]
elem = "menu:2.2"
kind = "view"
label = "view-order-priority"
view = "order-priority"

[[menu.entries]]
elem = "menu:2.3"
kind = "view"
label = "view-order-due"
view = "order-due"

[[menu]]
elem = "menu:3"
kind = "standard-help"

# ---- page "board": F-006 board, F-007 card, F-008 side panel (list-detail), F-009 entry row, F-010 side list
[[page]]
elem = "page:board"
page = "board"
frame = "workbench"
navigation = "list-detail"

[[page.place]]
elem = "block:board/side"
at = "side"
block = "sidebar"
source = 1
title = "tasks-side-title"

# card-facts nth 1 = priority: since cards-in-columns@1.3.0 its own channel (no longer a fact; the field name stays). Shown as a number until the P0-P3 mapping (Bündel 1b).
# Form 1.4.0 (fs-interfaces 83b96e30, module planning 908f1c1f): new channels state, assignee (repeats), time-zone. The four card-facts
# slots are full (due, priority, participants, keywords), so on the CARD these three are `offen` (no slot, nothing faked): the card
# does NOT show the people in charge; state, assignee and time zone appear only in the detail panel below.
[[page.place]]
elem = "block:board/main"
at = "main"
block = "board"
source = 1

[[page.place.bind]]
elem = "binding:board/main/card-facts/0"
slot = "card-facts"
nth = 0
field = "due"
role = "compact"

[[page.place.bind]]
elem = "binding:board/main/card-facts/1"
slot = "card-facts"
nth = 1
field = "priority"
role = "compact"

[[page.place.bind]]
elem = "binding:board/main/card-facts/2"
slot = "card-facts"
nth = 2
field = "participants"
role = "compact"

[[page.place.bind]]
elem = "binding:board/main/card-facts/3"
slot = "card-facts"
nth = 3
field = "keywords"
role = "compact"

[[page.place.bind]]
elem = "binding:board/main/card-lock/0"
slot = "card-lock"
nth = 0
lock = true

[[page.place.bind]]
elem = "binding:board/main/card-menu/0"
slot = "card-menu"
nth = 0
command = "task.delete"

[[page.place.bind]]
elem = "binding:board/main/card-title/0"
slot = "card-title"
nth = 0
field = "title"
role = "display"

[[page.place.bind]]
elem = "binding:board/main/cards/0"
slot = "cards"
nth = 0

[[page.place.bind]]
elem = "binding:board/main/columns/0"
slot = "columns"
nth = 0
grouping = "board"

[[page.place.bind]]
elem = "binding:board/main/move/0"
slot = "move"
nth = 0
command = "card.move"

[[page.place.bind]]
elem = "binding:board/main/order/0"
slot = "order"
nth = 0
order = "rank"

[[page.place.bind]]
elem = "binding:board/main/quick-add/0"
slot = "quick-add"
nth = 0
command = "task.create"

# Detail panel, form 1.4.0 (fields of planning catalog/forms.json, map): `progress` = the status word (channel `state`, JSCalendar progress;
# missing for an invalid stored word), `percentComplete` = the number (channel `progress`), `estimatedDuration` (channel `estimated`),
# `timeZone` (channel `time-zone`; due stays an instant with Z, the zone says where it was set; showing it in the zone of the viewer is the host's job, `offen`),
# `assignee` (channel `assignee`, one value per person in charge = role chair; the value is the IRI, the name belongs to the people module;
# `offen`: the host keeps only the last repeated value until fs-starter P9 lands, so only one person may show).
# description and color are own channels since 1.3.0 (data, no colour in the form file).
[[page.place]]
elem = "block:board/detail"
at = "detail"
block = "board-detail"
source = 1

[[page.place.bind]]
elem = "binding:board/detail/lock/0"
slot = "lock"
nth = 0
lock = true

[[page.place.bind]]
elem = "binding:board/detail/properties/0"
slot = "properties"
nth = 0
field = "priority"
role = "display"

[[page.place.bind]]
elem = "binding:board/detail/properties/1"
slot = "properties"
nth = 1
field = "due"
role = "display"

[[page.place.bind]]
elem = "binding:board/detail/properties/2"
slot = "properties"
nth = 2
field = "participants"
role = "display"

[[page.place.bind]]
elem = "binding:board/detail/properties/3"
slot = "properties"
nth = 3
field = "keywords"
role = "display"

[[page.place.bind]]
elem = "binding:board/detail/properties/4"
slot = "properties"
nth = 4
field = "description"
role = "display"

[[page.place.bind]]
elem = "binding:board/detail/properties/5"
slot = "properties"
nth = 5
field = "color"
role = "display"

[[page.place.bind]]
elem = "binding:board/detail/properties/6"
slot = "properties"
nth = 6
field = "progress"
role = "display"

[[page.place.bind]]
elem = "binding:board/detail/properties/7"
slot = "properties"
nth = 7
field = "percentComplete"
role = "display"

[[page.place.bind]]
elem = "binding:board/detail/properties/8"
slot = "properties"
nth = 8
field = "estimatedDuration"
role = "display"

[[page.place.bind]]
elem = "binding:board/detail/properties/9"
slot = "properties"
nth = 9
field = "timeZone"
role = "display"

[[page.place.bind]]
elem = "binding:board/detail/properties/10"
slot = "properties"
nth = 10
field = "assignee"
role = "display"

[[page.place.bind]]
elem = "binding:board/detail/record/0"
slot = "record"
nth = 0

[[page.place.bind]]
elem = "binding:board/detail/title/0"
slot = "title"
nth = 0
field = "title"
role = "display"

# states the host shows without code (accepts = []): a locked binding is shown as a notice, never an empty area
[[page.place]]
elem = "block:board/partial"
at = "partial"
block = "partial-notice"

[[page.place]]
elem = "block:board/empty"
at = "empty"
block = "empty-state"
title = "tasks-board-empty-title"
text = "tasks-board-empty-text"

# ---- actions: drag a card (move), entry row (create), delete (confirm: only where data is lost, F-025)
[[action]]
elem = "action:1"
trigger = "quick-add"
source = 1
command = "task.create"

[[action]]
elem = "action:2"
trigger = "drop"
source = 1
command = "card.move"

[[action]]
elem = "action:3"
trigger = "menu"
source = 1
command = "task.delete"
confirm = "confirm"

