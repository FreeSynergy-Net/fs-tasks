# forms description of the fs-tasks frontend "day" (Day list, F-011, F-012). IMPORT FORM ONLY (ADR 0096 point 6), Format 3.
# Groups of the old list (plan_view/next.rs GROUPS): TODAY (due today or overdue, nothing blocking), READY (later or no date),
# BLOCKED (waits for another task). They are a grouping the PROGRAM provides by name ("standing", unproven: no TypeCatalog yet);
# the description only names it (rules are never in the description, ADR 0096 point 1). Blocks without declared slots are placed
# without bindings; see ../FEHLENDE-COMPONENTS.md. Nothing is invented here.
schema = 3
kind = "frontend"
id = "day"
extends = "net.freesynergy.Tasks"
exec = "fs-forms-run"
title = "tasks-day-title"
style = "default"

[[requires]]
elem = "requires:1"
contract = "planning@>=0.0.1, <0.1.0"

[[source]]
elem = "source:1"
n = 1
contract = "planning@>=0.0.1, <0.1.0"
type = "Task"
scope = "selected-list"

[[menu]]
elem = "menu:0"
kind = "standard-program"

[[menu]]
elem = "menu:1"
kind = "menu"
label = "menu-task"

[[menu.entries]]
elem = "menu:1.0"
kind = "command"
source = 1
command = "task.create"
key = "ctrl+n"

[[menu]]
elem = "menu:2"
kind = "standard-help"

[[page]]
elem = "page:day"
page = "day"
frame = "workbench"
navigation = "single"

[[page.place]]
elem = "block:day/side"
at = "side"
block = "sidebar"
source = 1
title = "tasks-day-side"

[[page.place]]
elem = "block:day/rows"
at = "rows"
block = "task-row"
source = 1

[[page.place]]
elem = "block:day/add"
at = "add"
block = "quick-add"
source = 1
title = "tasks-day-add"

[[page.place]]
elem = "block:day/partial"
at = "partial"
block = "partial-notice"

[[page.place]]
elem = "block:day/empty"
at = "empty"
block = "empty-state"
title = "tasks-day-empty-title"
text = "tasks-day-empty-text"

[[action]]
elem = "action:1"
trigger = "quick-add"
source = 1
command = "task.create"

[[view]]
elem = "view:today"
view = "today"
grouping = "standing"

[[view.order]]
elem = "view-order:today/1"
by = "field"
name = "due"
descending = false

[[view.order]]
elem = "view-order:today/2"
by = "order"
name = "rank"
descending = false

[[message]]
elem = "message:menu-task/de"
key = "menu-task"
lang = "de"
text = "Aufgabe"

[[message]]
elem = "message:menu-task/en"
key = "menu-task"
lang = "en"
text = "Task"

[[message]]
elem = "message:tasks-day-add/de"
key = "tasks-day-add"
lang = "de"
text = "Schnell anlegen"

[[message]]
elem = "message:tasks-day-add/en"
key = "tasks-day-add"
lang = "en"
text = "Quick add"

[[message]]
elem = "message:tasks-day-empty-text/de"
key = "tasks-day-empty-text"
lang = "de"
text = "Neue Aufgabe"

[[message]]
elem = "message:tasks-day-empty-text/en"
key = "tasks-day-empty-text"
lang = "en"
text = "New to-do"

[[message]]
elem = "message:tasks-day-empty-title/de"
key = "tasks-day-empty-title"
lang = "de"
text = "Hier ist nichts zu tun"

[[message]]
elem = "message:tasks-day-empty-title/en"
key = "tasks-day-empty-title"
lang = "en"
text = "Nothing to do here"

[[message]]
elem = "message:tasks-day-side/de"
key = "tasks-day-side"
lang = "de"
text = "Listen"

[[message]]
elem = "message:tasks-day-side/en"
key = "tasks-day-side"
lang = "en"
text = "Lists"

[[message]]
elem = "message:tasks-day-title/de"
key = "tasks-day-title"
lang = "de"
text = "Aufgaben, Tagesliste"

[[message]]
elem = "message:tasks-day-title/en"
key = "tasks-day-title"
lang = "en"
text = "Tasks, day list"
