# Blueprint of fs-tasks (schema 2, ADR 0099 addendum 2026-11-18). Data-only package;
# the module is planning (fs-modules-planning, tag v0.0.5); the forms description lies in forms/.
schema = 2

[program]
name = "tasks"
version = "0.0.11"
skeleton = "0.1.0"
capability = "tasks"
summary = { en = "Tasks, dependencies and boards", de = "Aufgaben, Abhängigkeiten und Boards" }
description = { en = "Plan and track tasks as JSCalendar tasks, with dependencies and boards.", de = "Aufgaben als JSCalendar-Aufgaben planen und verfolgen, mit Abhängigkeiten und Boards." }
categories = ["Office", "ProjectManagement"]

[contract]
version = "0.1"
id = "0xc04d258971543476"
provides = [{ contract = "dependency.evaluate", version = "0.1" }, { contract = "dependency.cycle-check", version = "0.1" }]

# Art 1: the planning module (fs-modules-planning) owns the type Task (JSCalendar Task, RFC 8984; VTODO, RFC 5545).
[[module]]
name = "planning"
kind = "standard"
version = "0.0.5"

# Art 3: display only, named for the frontend manifest.
[[module]]
name = "board"
kind = "component"
version = "0.0.29"

[[module]]
name = "task-card"
kind = "component"
version = "0.0.29"

[[type]]
name = "Task"
module = "planning"

# The main view is a forms description (written by task V-F); the board columns come from a column source (basic list: RFC 8984 progress; states belong to the run, ADR 0103).
[frontend]
standard = "board"
layout = "forms/board.toml"
covers = ["Items.list", "Items.query", "Items.create", "Items.editIf", "Items.readiness"]
